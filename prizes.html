<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カギフェス2026 景品リスト</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pz-head{text-align:center;margin:6px 0 10px}
    .pz-head .eyebrow{margin:0}
    .pz-head h1{margin:2px 0 4px;font-size:2rem}
    .pz-head p{margin:0;font-weight:bold;color:#555}
    .pz{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--c);border-radius:14px;padding:8px 12px 8px 8px;margin:0 0 9px}
    .pz .lv{background:var(--c);color:#fff;font-weight:900;border-radius:10px;min-width:62px;text-align:center;padding:8px 0;font-size:1.25rem}
    .pz .em{font-size:2rem;width:42px;text-align:center}
    .pz .nm{flex:1;font-weight:900;font-size:1.1rem;line-height:1.25}
    .pz .nm b{display:block;color:var(--c);font-size:1.45rem;line-height:1.15}
    .pz.top{border-width:4px;background:#fff6ec;padding:12px 12px 12px 8px}
    .pz.top .lv{font-size:1.6rem;min-width:76px;padding:12px 0}
    .pz.top .nm{font-size:1.5rem}
    .pz-part{border:3px dashed #999;border-radius:14px;background:#f6f6f6;text-align:center;padding:10px;font-weight:900;font-size:1.2rem;margin-bottom:12px}
    .pz-part small{display:block;font-size:.85rem;color:#555;margin-top:2px}
    .pz-note{font-size:.88rem;color:#555;line-height:1.7;font-weight:600}
    .pz-back{display:block;text-align:center;margin:16px auto 8px;padding:14px;max-width:320px;font-size:1.15rem;font-weight:800;color:#fff;background:var(--pink);border-radius:40px;text-decoration:none}
  </style>
</head>
<body>
<main class="app">
  <header class="pz-head">
    <p class="eyebrow">カギフェス2026</p>
    <h1>🎁 景品リスト</h1>
    <p>くじを ひくと、どれかが 当たるよ!</p>
  </header>

  <div class="pz top" style="--c:#c62828"><div class="lv">1等</div><div class="em">🍚</div><div class="nm">お米 10kg</div></div>
  <div class="pz" style="--c:#e65100"><div class="lv">2等</div><div class="em">💳</div><div class="nm">QUOカード<b>3,000円分</b></div></div>
  <div class="pz" style="--c:#ef6c00"><div class="lv">3等</div><div class="em">💳</div><div class="nm">QUOカード<b>2,000円分</b></div></div>
  <div class="pz" style="--c:#d68a00"><div class="lv">4等</div><div class="em">💳</div><div class="nm">QUOカード<b>1,000円分</b></div></div>
  <div class="pz" style="--c:#2e7d32"><div class="lv">5等</div><div class="em">🧳</div><div class="nm">トラベルセット</div></div>
  <div class="pz" style="--c:#00838f"><div class="lv">6等</div><div class="em">🧻</div><div class="nm">トイレットペーパー</div></div>
  <div class="pz" style="--c:#1565c0"><div class="lv">7等</div><div class="em">🍬</div><div class="nm">おかし袋</div></div>
  <div class="pz" style="--c:#6a1b9a"><div class="lv">8等</div><div class="em">🥤</div><div class="nm">ジュース</div></div>

  <div class="pz-part">🎁 参加賞<small>1〜8等が 当たらなくても、参加賞が もらえます</small></div>

  <p class="pz-note">※景品が なくなったら おわりです。<br>※景品の 中身は、かわることが あります。<br>※くじは 1人 1回です。<br>※景品引換所は、しょうわちょうこうしゃ 2F じむしょまえ(14:50まで)</p>

  <a class="pz-back" href="./">← スタンプラリーへ もどる</a>
</main>
</body>
</html>

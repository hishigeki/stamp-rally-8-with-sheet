<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景品交換管理(予備)</title>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f7f7f7;padding:16px;max-width:520px;margin:auto}
h1{text-align:center}
#reader{width:100%;max-width:420px;margin:auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-top:16px;text-align:center;border:2px solid #ddd;word-break:break-all}
.ok{border-color:#2ecc71;background:#f0fff5}.ng{border-color:#e74c3c;background:#fff0f0}.warn{border-color:#f1c40f;background:#fffbea}
button{font-size:18px;padding:14px 18px;border-radius:10px;border:none;color:#fff;font-weight:bold;margin:8px 0;width:100%}
.go{background:#2ecc71}.scan{background:#3498db}
input{font-size:18px;padding:10px;width:100%;box-sizing:border-box}
</style>
</head>
<body>
<h1>景品交換管理(予備)</h1>
<p style="font-size:.85rem;color:#666">通常は福引サーバー(/host)で交換します。これは福引を使わず景品を渡すときの予備画面です。</p>
<div id="login" class="card">
  <p>運営用トークン(ADMIN_TOKEN)を入力</p>
  <input id="tok" type="password" autocomplete="off">
  <button class="scan" id="loginBtn">開始</button>
</div>
<div id="app" style="display:none">
  <div id="reader"></div>
  <div id="result" class="card">参加者のコンプリート画面のQRコードを読み取ってください。</div>
</div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzfduTsOl5TIlOUYcYxkKdWewy_4gAYL2tsRzO4XYi9xNWabrofhcsQz_HKOs1XlPtD7Q/exec";
let TOKEN = "", qr = null, busy = false, seq = 0;
const $ = id => document.getElementById(id);

function show(title, lines, cls, buttons) {
  const r = $("result");
  r.className = "card " + cls;
  r.textContent = "";
  const h = document.createElement("h2"); h.textContent = title; r.appendChild(h);
  (lines || []).forEach(t => { const p = document.createElement("p"); p.textContent = t; r.appendChild(p); });
  (buttons || []).forEach(b => {
    const el = document.createElement("button");
    el.className = b.cls; el.textContent = b.text; el.onclick = b.fn; r.appendChild(el);
  });
}
function gas(params) {
  return new Promise((resolve, reject) => {
    const name = "__a" + (++seq);
    const s = document.createElement("script");
    const end = () => { delete window[name]; s.remove(); };
    const t = setTimeout(() => { end(); reject(new Error("timeout")); }, 12000);
    window[name] = res => { clearTimeout(t); end(); resolve(res); };
    s.onerror = () => { clearTimeout(t); end(); reject(new Error("net")); };
    const u = new URL(GAS_URL);
    Object.entries({ ...params, token: TOKEN, callback: name }).forEach(([k, v]) => u.searchParams.set(k, v));
    s.src = u.toString();
    document.body.appendChild(s);
  });
}
function next() { busy = false; try { qr.resume(); } catch (e) {} }

async function onScan(text) {
  if (busy) return;
  busy = true;
  try { qr.pause(true); } catch (e) {}
  const pid = String(text).trim();
  show("確認中...", [pid], "warn");
  let res;
  try { res = await gas({ action: "checkPrize", participantId: pid }); }
  catch (e) { show("GASに接続できません", ["通信を確認してください。"], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]); return; }
  if (res && res.error === "token") { show("トークンが違います", ["ADMIN_TOKEN を確認してください。"], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]); return; }
  const r = res && res.result;
  if (r === "OK") {
    show("交換OK", [pid, "景品を渡す前に押してください。"], "ok", [{ cls: "go", text: "交換済みにする", fn: async () => {
      try {
        const c = await gas({ action: "claimPrize", participantId: pid, mode: "normal" });
        if (c && c.result === "OK") show("記録しました", ["景品をお渡しください。"], "ok", [{ cls: "scan", text: "次を読み取る", fn: next }]);
        else show("記録できませんでした", [String(c && c.result)], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]);
      } catch (e) { show("通信エラー", ["もう一度読み取って確認してください。"], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]); }
    } }, { cls: "scan", text: "やめる", fn: next }]);
  } else if (r === "DUPLICATE") show("交換済み", [pid, "すでに景品を渡しています。"], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]);
  else if (r === "NOT_COMPLETE") show("未コンプリート", [pid], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]);
  else if (r === "UNKNOWN_ID") show("記録なし", [pid, "送信が届いていない可能性があります。画面で12個そろっているか確認してください。"], "warn", [{ cls: "scan", text: "次を読み取る", fn: next }]);
  else show("確認できません", [String(r)], "ng", [{ cls: "scan", text: "次を読み取る", fn: next }]);
}

$("loginBtn").onclick = () => {
  TOKEN = $("tok").value.trim();
  if (!TOKEN) return;
  $("login").style.display = "none";
  $("app").style.display = "block";
  qr = new Html5Qrcode("reader");
  qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScan, () => {})
    .catch(() => show("カメラを起動できません", ["カメラの許可を確認してください。"], "ng"));
};
</script>
</body>
</html>
